<!DOCTYPE html>
<html lang="pt" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <!-- Controlo de Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>GaloFire — Pirotecnia de Barcelos</title>
    <meta name="description" content="Catálogo GaloFire 2026 — Barcelos tem o Galo, nós tratamos do estalo!">
    <meta name="theme-color" content="#05060a">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="GaloFire - Barcelos tem o Galo, nós tratamos do estalo!">
    <meta property="og:description" content="Catálogo 2026 — Baterias e Bombinhas.">
    <meta property="og:image" content="https://galofire.pages.dev/ico.jpg">
    <link rel="icon" type="image/jpeg" href="ico.jpg">

    <!-- Fontes & Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Chakra Petch', 'sans-serif']
                    },
                    colors: {
                        gold: { 300: '#FDE047', 400: '#FACC15', 500: '#EAB308', 600: '#CA8A04' },
                        ember: { 500: '#F97316', 600: '#EA580C' },
                        dark: { 950: '#05060a', 900: '#0b0f19', 800: '#151c2c' }
                    }
                }
            }
        }
    </script>
</head>

<body class="text-slate-100 antialiased min-h-screen flex flex-col selection:bg-gold-500 selection:text-black">

    <!-- Brasas subtis em pano de fundo -->
    <canvas id="ember-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Navegação Fixa -->
    <nav class="fixed top-0 w-full z-50 nav-glass border-b border-white/10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <img src="ico.jpg" alt="GaloFire" class="w-9 h-9 rounded-lg object-cover border border-gold-400/50">
                <div class="flex flex-col">
                    <span class="font-black text-xl sm:text-2xl text-white tracking-wide uppercase leading-none">
                        Galo<span class="text-gold-400">Fire</span>
                    </span>
                    <span class="text-[10px] text-gold-400 tracking-[0.2em] uppercase font-bold">Barcelos</span>
                </div>
            </div>

            <span class="font-display font-bold text-xs uppercase tracking-[0.18em] text-gold-400 border border-gold-400/30 bg-gold-500/10 px-3 py-1 rounded-md">
                Catálogo 2026
            </span>
        </div>
    </nav>

    <!-- Cabeçalho Principal -->
    <header class="relative z-10 pt-24 pb-4 sm:pt-32 sm:pb-8 px-4 text-center">
        <div class="hero-spotlight"></div>

        <!-- Destaque Nova Campanha 2026 -->
        <div class="inline-block mb-3 px-4 py-1 rounded-md campaign-banner font-display font-bold text-xs sm:text-sm uppercase tracking-[0.22em] text-black">
            Nova Campanha 2026
        </div>

        <h1 class="logo-glow text-5xl sm:text-7xl md:text-8xl font-black text-white mb-2 sm:mb-4 uppercase tracking-tight">
            Galo<span class="text-transparent bg-clip-text bg-gradient-to-r from-gold-400 to-orange-500">Fire</span>
        </h1>

        <p class="subtitle-shadow text-gold-400 text-base sm:text-2xl md:text-3xl italic font-bold px-2">
            "Barcelos tem o Galo, nós tratamos do estalo!"
        </p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="relative z-10 container mx-auto px-3 sm:px-4 pb-20 flex-grow">

        <!-- Abas de Navegação Sticky -->
        <div class="flex justify-center mb-6 sm:mb-10 sticky top-[62px] sm:top-[68px] z-40 py-1">
            <div class="cyber-tabs p-1.5 rounded-full inline-flex shadow-2xl">
                <button onclick="mudarAba('baterias')" id="tabBaterias"
                    class="tab-btn active-tab px-6 py-2.5 text-xs sm:px-9 sm:py-3 sm:text-base font-extrabold uppercase tracking-wider transition-all duration-300 flex items-center gap-2 rounded-full">
                    <i class="fas fa-fire"></i> Baterias
                </button>
                <button onclick="mudarAba('bombinhas')" id="tabBombinhas"
                    class="tab-btn px-6 py-2.5 text-xs sm:px-9 sm:py-3 sm:text-base font-extrabold uppercase tracking-wider text-slate-400 hover:text-white transition-all duration-300 flex items-center gap-2 rounded-full">
                    <i class="fas fa-bomb"></i> Bombinhas
                </button>
            </div>
        </div>

        <!-- Grelha de Produtos -->
        <div id="galleryContainer" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-6">
        </div>

        <!-- Indicador de Loading -->
        <div id="loadingState" class="text-center py-20">
            <i class="fas fa-circle-notch fa-spin text-3xl text-gold-500"></i>
            <p class="text-slate-500 mt-2">A carregar produtos...</p>
        </div>
    </main>

    <!-- Modal de Zoom da Imagem -->
    <div id="productModal" class="fixed inset-0 z-[90] bg-black/90 backdrop-blur-md hidden items-center justify-center p-4 opacity-0 transition-opacity duration-200" onclick="fecharModal()">
        <div class="relative max-w-md w-full bg-dark-900 border border-gold-400/40 rounded-2xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200" id="modalCard" onclick="event.stopPropagation()">
            <button onclick="fecharModal()" aria-label="Fechar" class="absolute top-3 right-3 z-30 w-9 h-9 rounded-full bg-black/80 border border-white/20 text-white flex items-center justify-center">
                <i class="fas fa-times"></i>
            </button>
            <div class="aspect-square bg-dark-950 p-6 flex items-center justify-center relative">
                <div class="modal-spotlight"></div>
                <img id="modalImg" src="" alt="" class="max-w-full max-h-full object-contain relative z-10">
            </div>
            <div class="p-5 text-center border-t border-white/10 bg-dark-900">
                <h3 id="modalTitle" class="text-2xl font-black text-white uppercase mb-1"></h3>
                <p id="modalDesc" class="text-sm font-bold text-gold-400 uppercase tracking-wider mb-3"></p>
                <span class="text-4xl font-black text-white"><span id="modalPrice"></span><span class="text-2xl align-top text-gold-400">€</span></span>
            </div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="relative z-10 border-t border-white/10 py-8 text-center bg-dark-950">
        <p class="text-slate-500 text-sm">© 2026 GaloFire.</p>
    </footer>

    <!-- Intro Overlay -->
    <div id="intro-overlay"
        class="fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center transition-opacity duration-700 cursor-pointer select-none">
        <div id="intro-message"
            class="text-center z-10 p-5 opacity-0 transition-all duration-500 scale-90 transform">
            <div class="inline-block mb-4 px-4 py-1 rounded-md campaign-banner font-display font-bold text-xs sm:text-sm uppercase tracking-[0.22em] text-black">
                Nova Campanha 2026
            </div>
            <h1 class="text-5xl sm:text-7xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-gold-400 to-orange-500 mb-3 uppercase">
                GaloFire
            </h1>
            <p class="text-xl sm:text-3xl text-white font-bold">
                Faz a festa connosco!
            </p>
        </div>
        <div id="fireworks-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
    </div>

    <script src="dados.js" defer></script>
    <script src="app.js" defer></script>
</body>

</html>
